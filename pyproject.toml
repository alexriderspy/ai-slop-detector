[project]
name = "ai-slop-detector"
version = "0.1.0"
description = "Is this text written by a person, or churned out by an LLM? Rules, perplexity and a classifier."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "openai>=1.50",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "torch>=2.5",
    "transformers>=4.46",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "beautifulsoup4>=4.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slop"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts", "train.py", "evaluate.py"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
